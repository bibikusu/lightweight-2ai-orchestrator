change_guardrails:
  allowed_changes_detail:
    - "tests/test_dependency_graph.py: 5 test 関数を @pytest.mark.skip(reason='implementation pending session-194') 付で新規作成"
    - "tests/fixtures/dependency_graph/dep_graph_valid_minimal.json: 単一 session の最小 valid graph fixture を新規作成"
    - "tests/fixtures/dependency_graph/dep_graph_valid_chained.json: depends_on で線形連鎖する valid graph fixture を新規作成"
    - "tests/fixtures/dependency_graph/dep_graph_invalid_cycle.json: A→B→A の cycle を持つ invalid fixture を新規作成"
    - "tests/fixtures/dependency_graph/dep_graph_invalid_dangling.json: 存在しない session_id を depends_on に持つ dangling fixture を新規作成"
    - "docs/acceptance/session-194-pre.yaml: 本 session の AC を 4件・CC を 9件 で定義した YAML に更新"
    - "docs/acceptance/session-194.yaml: 194本体用 AC を session-190 の AC-190-01〜10 から派生して新規定義"
  forbidden_changes:
    - orchestration/ 配下の実装コードを変更しない
    - 既存 tests/ ファイルを編集しない (新規追加のみ可)
    - docs/sessions/session-194-pre.json を編集しない (commander 配備済・git add のみ)
    - orchestration/selector/ md5 baseline を変更しない
    - orchestration/run_session.py の md5 baseline を変更しない
    - git push を実行しない
    - main へのマージを実行しない
