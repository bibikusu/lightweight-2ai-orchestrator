  - 副作用なし
  - 検証十分性

# ================================================================
# handoff_artifact.v1 canonical 仕様正本
# ================================================================
handoff_artifact_schema_v1:
  schema_version: handoff_artifact.v1
  description: >-
    GPT (司令塔) → ClaudeCode (現場責任者) への handoff artifact の正本仕様。
    人間が読むメモではなく、再現・検証・再投入可能な machine-readable 境界物。

  canonical_decisions:
    canonical_format: JSON
    secondary_format_allowed: false
    deterministic_ordering: MUST
    replayability: MUST
    human_readable: auxiliary_only
    machine_readable: primary
    validation_mode: strict
    unknown_required_missing: fail
    unknown_extra_fields: warn
    optional_field_policy: minimal_for_schema_version_compat

  required_fields:
    - schema_version
    - artifact_id
    - session_id
    - created_by
    - target_agent
    - handoff_type
    - source_context.base_commit
    - source_context.required_prior_session
    - task.goal
    - task.scope
    - task.out_of_scope
    - allowed_changes_detail
    - forbidden_changes
    - acceptance_criteria
    - completion_criteria
    - validation.required_checks
    - validation.failure_type_on_invalid
    - replay.replayable
    - replay.requires_human_approval
    - replay.deterministic_ordering

  optional_fields:
    - source_context.assumptions
    - commander_note
    - summary

  field_types:
    schema_version: string          # 必ず "handoff_artifact.v1"
    artifact_id: string
    session_id: string
    created_by: "enum[GPT, ClaudeWeb]"
    target_agent: "enum[ClaudeCode, Cursor]"
    handoff_type: "enum[docs_only_session_generation, implementation, audit, repair]"
    source_context.base_commit: string   # full sha
    source_context.required_prior_session: string
    source_context.assumptions: list[string]
    task.goal: string
    task.scope: list[string]
    task.out_of_scope: list[string]
    allowed_changes_detail: list[string]   # 'パス:内容'
    forbidden_changes: list[string]
    acceptance_criteria: list[object]      # id / description / test_name
    completion_criteria: list[object]      # id / type / condition (type は canonical enum)
    validation.required_checks: list[string]
    validation.failure_type_on_invalid: string
    replay.replayable: bool
    replay.requires_human_approval: bool
    replay.deterministic_ordering: bool
    commander_note: string
    summary: string

  completion_criteria_canonical_type_enum:
    - document_rule
    - artifact
    - non_regression
    - state_transition_consistent
    - side_effect_free

  serialization:
    canonical_format: JSON
    secondary_format_allowed: false
    encoding: UTF-8
    line_ending: LF
    indent: 2
    key_ordering: deterministic_top_level_fixed_then_nested_sorted
    trailing_newline: required

  validation:
    mode: strict
    unknown_required_missing: fail
    unknown_extra_fields: warn
    type_check: enforced
    failure_type_on_invalid: spec_missing

  replay:
    replayable: true
    requires_human_approval: true
    deterministic_ordering: true
    base_commit_required: true

  rationale:
    - "JSON 正本理由: YAML は anchor / alias / multi-line の曖昧性があり、正本としての parse 容易性・schema validation 親和性が低い"
    - "deterministic ordering MUST 理由: replay 時の差分検証 (diff 安定) を可能にする"
    - "machine-readable primary 理由: AI agent 間 handoff は machine consumption が主用途であり、人間は補助的にレビューするのみ"
    - "strict validation 理由: 不完全 handoff の implicit pass 防止 (session-184-pre constraints 欠落事故 learning)"
    - "minimal optional 理由: schema bloat 防止と canonical truth の単純化"
    - "secondary_format_allowed=false の理由: YAML 並走を許すと正本が二重化し検証が弱体化する"

  out_of_scope_for_v1:
    - handoff generator 実装
    - validation engine 実装
    - replay runtime
    - MCP transport binding
    - state persistence
    - 自動 retry / 失敗時 escalation policy
    - schema_version migration (v2 以降の議論)
