session_id: session-172-pre
goal: hook / CI / run_session 結果の可視化ダッシュボード契約を定義する

scope:
  - hook / CI / run_session 結果の可視化対象を定義する
  - dashboard に表示する最小フィールドを定義する
  - 状態色・警告表示・human_gate 表示ルールを定義する
  - read-only dashboard としての制約を定義する
  - 後続 session-172 実装への handoff を定義する

out_of_scope:
  - dashboard 実装
  - HTML / CSS / JavaScript の作成
  - backend API 実装
  - GitHub Actions workflow 変更
  - run_session.py 変更
  - queue engine 変更
  - hook_eval_helper 変更
  - 自動復旧処理
  - 自動 push / 自動 merge

acceptance:
  - id: AC-172PRE-01
    requirement: dashboard の入力ソースが定義されている
    test_name: test_dashboard_input_sources_defined
    type: manual
    manual_check: true
    verification:
      - dashboard_contract.source_inputs に hook_eval_helper_result / ci_result / run_session_result / queue_state が定義されている

  - id: AC-172PRE-02
    requirement: dashboard の表示フィールドが定義されている
    test_name: test_dashboard_display_fields_defined
    type: manual
    manual_check: true
    verification:
      - display_fields に session_id / commit_hash / hook_status / ci_status / run_session_status / failure_type / human_gate_required が含まれる

  - id: AC-172PRE-03
    requirement: status enum が定義されている
    test_name: test_dashboard_status_values_defined
    type: manual
    manual_check: true
    verification:
      - hook_status / ci_status / run_session_status / human_gate_required の型と許可値が定義されている

  - id: AC-172PRE-04
    requirement: human_gate 表示ルールが定義されている
    test_name: test_human_gate_visual_rule_defined
    type: manual
    manual_check: true
    verification:
      - human_gate_required が true の場合 red_badge 表示と定義されている

  - id: AC-172PRE-05
    requirement: dashboard が read-only であることが明示されている
    test_name: test_dashboard_read_only_constraint
    type: manual
    manual_check: true
    verification:
      - constraints に commit / push / retry / merge を dashboard から実行してはならない旨が含まれる

  - id: AC-172PRE-06
    requirement: dashboard 側で判定ロジックを再実装しない制約がある
    test_name: test_dashboard_does_not_reimplement_logic
    type: manual
    manual_check: true
    verification:
      - constraints に判定ロジックを dashboard 側に再実装してはならない旨が含まれる

  - id: AC-172PRE-07
    requirement: docs-only であり実装変更を含まない
    test_name: test_docs_only_scope
    type: manual
    manual_check: true
    verification:
      - allowed_changes が docs/sessions/session-172-pre.json と docs/acceptance/session-172-pre.yaml の 2 件のみである
      - forbidden_changes に orchestration / scripts / tests / .github / .claude / dashboard が含まれる

completion_checks:
  - CC-172PRE-01: dashboard の入力ソースが定義されている
  - CC-172PRE-02: dashboard の表示フィールドが定義されている
  - CC-172PRE-03: hook / CI / run_session の状態値が矛盾なく定義されている
  - CC-172PRE-04: read-only 制約が明示されている
  - CC-172PRE-05: 既存 hook / CI / run_session / queue の責務を変更しない

change_guardrails:
  allowed_changes:
    - docs/sessions/session-172-pre.json
    - docs/acceptance/session-172-pre.yaml
  forbidden_changes:
    - orchestration/**
    - scripts/**
    - tests/**
    - .github/**
    - .claude/**
    - dashboard/**
    - docs/config/**
    - docs/master_instruction.md
    - docs/global_rules.md
    - 既存 session 定義の変更
    - 既存 acceptance 定義の変更
    - hook_eval_helper 判定ロジックの変更
    - run_session 制御ロジックの変更
    - queue engine 実装変更
    - scope 外ファイル変更
