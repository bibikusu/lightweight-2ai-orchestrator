  manual_check: true
  verification:
  - docs/sessions/session-191-pre.json をパースし、session_id / phase_id / title / goal
    / scope / out_of_scope / constraints / acceptance_ref / allowed_changes_detail
    / forbidden_changes / completion_criteria / acceptance_criteria / review_points
