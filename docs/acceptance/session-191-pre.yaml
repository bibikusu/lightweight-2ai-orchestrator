  - scope 配列に session 固有 required の追加ルールが含まれることを確認する。
  completion_criteria_refs:
  - CC-191-pre-03
- id: AC-191-pre-06
  description: scope 内に forbidden files 規則（sealed / .git / .env / secret 強制除外 + session
