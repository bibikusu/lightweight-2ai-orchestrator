  - scope 配列に最大量超過時の fail-fast 規律が含まれることを確認する。
  completion_criteria_refs:
  - CC-191-pre-02
- id: AC-191-pre-04
  description: scope 内に previous session summary 形式（必須 fields と要約上限文字数）が明記されている。
  test_name: test_session_191_pre_documents_previous_session_summary
