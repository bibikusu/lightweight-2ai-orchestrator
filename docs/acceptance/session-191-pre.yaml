  test_name: test_session_191_pre_documents_compression_with_delegation
  type: manual
  manual_check: true
  verification:
  - scope 配列に compression 規則として diff_only / summary / drop の 3 方式が含まれることを確認する。
  - scope 配列に肥大防止規律として max_tokens 超過時 summary→drop の優先順位が含まれることを確認する。
  - constraints と out_of_scope 配列に LLM 呼出は別 session（router 担当）に委譲する責務境界が明記されていることを確認する。
