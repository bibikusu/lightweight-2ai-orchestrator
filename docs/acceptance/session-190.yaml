  と test_name を持つ'
- 'CC-190-03: implementation contract に graph artifact path artifacts/session-190/dependency_graph/graph.json
  が JSON artifact として明記されている'
- 'CC-190-04: graph schema が nodes / edges / metadata / errors を持ち、node identity が
  session_id 基準であることを明記している'
- 'CC-190-05: cycle failure semantics が例外ではなく result object の success=false / failure_type=spec_missing
