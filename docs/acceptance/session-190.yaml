session_id: session-190
goal: dependency graph implementation の正式契約を定義し、session 依存関係を read-only projection
  として deterministic に構築・保存できる実装範囲を固定する
scope:
- session-190-pre の depends_on schema / blocks schema / ready = AND 条件 / cycle detection
  boundary / resolution ordering / followup delegation / queue・scheduler 実行制御委譲を継承する
- dependency graph implementation contract を docs-only で固定する
- graph schema を node / edge / metadata / errors に分解して定義する
- node identity を session_id 基準として定義する
- depends_on / blocks から edge structure を構築する規則を定義する
- ready 判定は depends_on 全要素が完了済みである AND 条件として定義する
- deterministic ordering を session_id 昇順と input order 保存の組み合わせで定義する
- serialization は JSON artifact として定義する
- artifact path を artifacts/session-190/dependency_graph/graph.json として定義する
- 'public API を build_dependency_graph(session_ids: list[str], repo_root: pathlib.Path)
  -> DependencyGraphResult として定義する'
- cycle failure semantics を例外ではなく result object 内の success=false / failure_type=spec_missing
  / errors[] で返す規則として定義する
- selector / queue / scheduler / PCC との責務境界を明文化する
out_of_scope:
- 実装
- orchestration/dependency_graph 配下のコード作成
- queue 変更
- selector 変更
- PCC 変更
- run_session.py 変更
- graph runtime mutation
- scheduler integration
- hooks integration
- persistence layer 追加
- visualization UI 追加
- 既存公開契約 build_compact_context_pack / validate_handoff / build_then_validate / ValidationResult
  / HandoffPipelineResult の変更
- queue state の mutate
- selector input の mutate
- scheduler dispatch 実装
- PCC UI 実装
- graph visualization runtime 実装
