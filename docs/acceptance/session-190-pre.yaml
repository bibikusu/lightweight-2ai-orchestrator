    / forbidden_changes / completion_criteria / acceptance_criteria / review_points
    / failure_type の 14 キーがすべて存在することを確認する。
  - docs/acceptance/session-190-pre.yaml のトップレベル session_id が session-190-pre であることを確認する。
  completion_criteria_refs:
  - CC-190-pre-05
  - CC-190-pre-06
