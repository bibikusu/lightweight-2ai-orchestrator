  description: review_points が短文 4 軸（仕様一致（AC達成）/ 変更範囲遵守 / 副作用なし / 検証十分性）で配列順固定であり、failure_type
    が spec_missing である。
  test_name: test_session_190_pre_review_points_short_form_and_failure_type_spec_missing
  type: manual
  manual_check: true
  verification:
  - docs/sessions/session-190-pre.json の review_points が ['仕様一致（AC達成）', '変更範囲遵守',
    '副作用なし', '検証十分性'] で配列順固定であることを確認する。
  - docs/sessions/session-190-pre.json の failure_type が spec_missing であることを確認する。
  completion_criteria_refs:
  - CC-190-pre-07
- id: AC-190-pre-09
  description: 変更ファイルが docs/sessions/session-190-pre.json と docs/acceptance/session-190-pre.yaml
    の 2 件に限定され、実装コード・既存 session・既存 docs への副作用が発生していない。
  test_name: test_session_190_pre_changed_files_limited_to_two_docs_only
  type: manual
  manual_check: true
  verification:
  - git diff --name-only で変更ファイル一覧を取得し、docs/sessions/session-190-pre.json と docs/acceptance/session-190-pre.yaml
    の 2 件のみであることを確認する。
  - orchestration/run_session.py / orchestration/drift_detector.py / selector / providers
    / backend / .github / docs/templates / docs/global_rules.md / docs/master_instruction.md
    / docs/sessions/ 配下の既存 session 定義 / docs/acceptance/ 配下の既存 acceptance 定義に差分がないことを確認する。
  completion_criteria_refs:
  - CC-190-pre-08
