  - "仕様一致（AC達成）"
  - "変更範囲遵守"
  - "副作用なし（既存破壊なし）"
  - "検証十分性"

forbidden_diff_paths:
  - orchestration/run_session.py
  - orchestration/selector/**
  - orchestration/**
  - tests/**
  - .claude/**
  - hooks/**
  - preflight_session.sh
  - docs/master_instruction.md
  - docs/global_rules.md
  - docs/config/**

protected_baselines:
  - file: orchestration/run_session.py
    md5: 4de6affffb9297cdf02b3136e8f55172
  - file: orchestration/selector/core.py
    md5: 9b19e2cbe3487d3090096c5343c88611
  - file: orchestration/selector/loader.py
