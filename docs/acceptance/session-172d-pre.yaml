session_id: session-172d-pre
phase_id: P7
title: "Project Command Center v0 仕様正本化（docs-only / read-only aggregation layer）"
session_type: docs_only_specification
related_spec: docs/specs/project_command_center_v0_spec.md

acceptance_criteria:
  - id: AC-172D-PRE-01
    description: "session-172d-pre.json が存在し JSON parse 可能"
    test_name: test_session_172d_pre_json_exists_and_parseable
    type: auto
    method: json_parse
    target: docs/sessions/session-172d-pre.json
    completion_criteria_refs: [CC-172D-PRE-01]

  - id: AC-172D-PRE-02
    description: "acceptance YAML が存在し safe_load 可能"
    test_name: test_acceptance_172d_pre_yaml_exists_and_parseable
    type: auto
    method: yaml_safe_load
    target: docs/acceptance/session-172d-pre.yaml
    completion_criteria_refs: [CC-172D-PRE-02]

  - id: AC-172D-PRE-03
    description: "spec markdown が存在する"
    test_name: test_spec_pcc_v0_md_exists
    type: auto
    method: file_exists
    target: docs/specs/project_command_center_v0_spec.md
    completion_criteria_refs: [CC-172D-PRE-03]

  - id: AC-172D-PRE-04
    description: "session JSON が必須14キー全てを含む"
    test_name: test_session_172d_pre_has_14_keys
    type: auto
    method: required_keys_check
    target: docs/sessions/session-172d-pre.json
    required_keys:
      - session_id
      - phase_id
      - title
      - goal
      - scope
      - out_of_scope
      - constraints
      - acceptance_ref
      - allowed_changes
      - allowed_changes_detail
      - forbidden_changes
      - completion_criteria
      - acceptance_criteria
      - review_points
    completion_criteria_refs: [CC-172D-PRE-04]

  - id: AC-172D-PRE-05
    description: "allowed_changes_detail が『path: 内容』形式の list[str]"
    test_name: test_session_172d_pre_allowed_changes_detail_path_colon_format
    type: auto
    method: regex_each_element_match
    target: docs/sessions/session-172d-pre.json
    json_path: $.allowed_changes_detail
    pattern: '^[^:\s]+:\s+.+$'
    completion_criteria_refs: [CC-172D-PRE-05]

  - id: AC-172D-PRE-06
    description: "completion_criteria.type が全て canonical enum のいずれか"
    test_name: test_session_172d_pre_completion_criteria_type_in_enum
    type: auto
    method: enum_membership_check
    target: docs/sessions/session-172d-pre.json
    json_path: "$.completion_criteria[*].type"
    allowed_values:
      - document_rule
      - artifact
      - non_regression
      - state_transition_consistent
      - side_effect_free
    completion_criteria_refs: [CC-172D-PRE-06]

  - id: AC-172D-PRE-07
    description: "review_points が固定4軸を順序通り文字一致で含む"
    test_name: test_session_172d_pre_review_points_fixed_four_axes
    type: auto
    method: list_equals_in_order
    target: docs/sessions/session-172d-pre.json
    json_path: $.review_points
    expected:
      - "仕様一致（AC達成）"
      - "変更範囲遵守"
      - "副作用なし（既存破壊なし）"
      - "検証十分性"
    completion_criteria_refs: [CC-172D-PRE-07]

  - id: AC-172D-PRE-08
    description: "spec にカード11項目が全て記載されている"
    test_name: test_spec_pcc_v0_card_items_present
    type: auto
    method: substring_all_present
    target: docs/specs/project_command_center_v0_spec.md
    required_substrings:
      - "project_id"
      - "repo_path"
      - "branch"
      - "HEAD"
      - "git status"
      - "最新 session"
      - "4-gate"
      - "failure_type"
      - "human gate"
      - "artifacts"
      - "手動更新"
    completion_criteria_refs: [CC-172D-PRE-08]

  - id: AC-172D-PRE-09
    description: "spec に『やらないこと』4項目が記載されている"
    test_name: test_spec_pcc_v0_out_of_scope_items_present
    type: auto
    method: substring_all_present
    target: docs/specs/project_command_center_v0_spec.md
    required_substrings:
      - "ClaudeCode を置き換えない"
      - "SDK自作オーケストレーター"
      - "stash@{0}"
      - "queue / scheduler"
    completion_criteria_refs: [CC-172D-PRE-09]

  - id: AC-172D-PRE-10
    description: "spec に source of truth 6種と DB/daemon/watcher 禁止が記載されている"
    test_name: test_spec_pcc_v0_source_of_truth_declared
    type: auto
    method: substring_all_present
    target: docs/specs/project_command_center_v0_spec.md
    required_substrings:
      - "git rev-parse"
      - "git status"
      - "docs/sessions"
      - "docs/acceptance"
      - "artifacts/reports"
      - "queue_state.json"
      - "DB禁止"
      - "daemon禁止"
      - "background watcher禁止"
    completion_criteria_refs: [CC-172D-PRE-10]

  - id: AC-172D-PRE-11
    description: "spec にカードは project_registry.json 由来で初期表示最大10件と記載されている"
    test_name: test_spec_pcc_v0_registry_driven_cards
    type: auto
    method: substring_all_present
    target: docs/specs/project_command_center_v0_spec.md
    required_substrings:
      - "project_registry.json"
      - "初期表示は最大10件"
    completion_criteria_refs: [CC-172D-PRE-11]

  - id: AC-172D-PRE-12
    description: "spec 冒頭に read-only aggregation layer 宣言がある"
    test_name: test_spec_pcc_v0_read_only_layer_declaration
    type: auto
    method: substring_all_present
    target: docs/specs/project_command_center_v0_spec.md
    required_substrings:
      - "read-only aggregation layer"
      - "状態可視化UI"
      - "実行制御システムではない"
    completion_criteria_refs: [CC-172D-PRE-12]

  - id: AC-172D-PRE-13
    description: "spec に『ClaudeWeb / ClaudeCode 投入方針』表が存在する"
    test_name: test_spec_pcc_v0_investment_policy_table_present
    type: auto
    method: substring_all_present
    target: docs/specs/project_command_center_v0_spec.md
    required_substrings:
      - "投入方針"
      - "ClaudeWeb"
      - "ClaudeCode"
      - "GPT"
      - "Human"
    completion_criteria_refs: [CC-172D-PRE-13]

  - id: AC-172D-PRE-14
    description: "constraints に依存順序『179系 close → 役割再定義 pivot → 172d 実装』が明示"
    test_name: test_session_172d_pre_order_dependency_declared
    type: auto
    method: constraints_substring_all_present
    target: docs/sessions/session-172d-pre.json
    json_path: $.constraints
    required_substrings:
      - "179系"
      - "役割再定義"
      - "172d"
    completion_criteria_refs: [CC-172D-PRE-14]

  - id: AC-172D-PRE-15
    description: "allowed_changes_detail と forbidden_changes が排他（self-conflict なし）"
    test_name: test_session_172d_pre_allowed_forbidden_exclusive
    type: auto
    method: glob_exclusivity_check
    target: docs/sessions/session-172d-pre.json
    rule: "allowed_changes_detail の各エントリのファイルパス（コロン手前）が forbidden_changes のいずれの glob にも完全一致しないこと（『は本 session の allowed なので例外』の文言を含むエントリは exception_keywords として除外可）"
    exception_keywords: ["は本 session の allowed なので例外"]
    completion_criteria_refs: [CC-172D-PRE-15]

  - id: AC-172D-PRE-16
    description: "git diff が allowed_changes 3ファイルのみ。.py / .sh / tests/** / 既存 docs/sessions/* / 既存 docs/acceptance/* / docs/config/** に差分なし"
    test_name: test_session_172d_pre_diff_scope_docs_only
    type: auto
    method: git_diff_path_check
    base_ref: origin/main
    expected_diff_paths_exact:
      - docs/sessions/session-172d-pre.json
      - docs/acceptance/session-172d-pre.yaml
      - docs/specs/project_command_center_v0_spec.md
    forbidden_diff_globs:
      - "*.py"
      - "*.sh"
      - "tests/**"
      - "selector/**"
      - "orchestration/**"
      - "hooks/**"
      - ".claude/**"
      - "run_session.py"
      - "docs/master_instruction.md"
      - "docs/global_rules.md"
      - "docs/config/**"
    completion_criteria_refs: [CC-172D-PRE-16]

  - id: AC-172D-PRE-17
    description: "保護対象4ファイルの md5 baseline が変化していない"
    test_name: test_session_172d_pre_protected_md5_unchanged
    type: auto
    method: md5_baseline_check
    targets:
      - file: orchestration/run_session.py
        expected_md5: 4de6affffb9297cdf02b3136e8f55172
      - file: orchestration/selector/core.py
        expected_md5: 9b19e2cbe3487d3090096c5343c88611
      - file: orchestration/selector/loader.py
        expected_md5: 959db533bf086f83765d8f6f16fbbe7b
      - file: orchestration/selector/writer.py
        expected_md5: aaf7e28e0e9c52d12d30c8d3349cf982
    completion_criteria_refs: [CC-172D-PRE-17]

manual_acceptance_criteria: []

