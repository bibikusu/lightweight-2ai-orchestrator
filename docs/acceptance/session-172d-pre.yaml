notes:
  - "docs-only セッション。実装コードおよび既存テストは1件も変更しない。"
  - "Project Command Center v0 は read-only aggregation layer。実行責務（ClaudeCode / run_session.py / queue engine）と判断責務（GPT / Human）には踏み込まない。"
  - "依存順序: 179系（VCER/RB 昇格）close → 役割再定義 pivot（180-pre / 180 / 181-pre / 181）→ 本 session の後続実装 session-172d（無印）。"
  - "stash@{0}（WIP: scheduler/batch/queue, chat51）は封印継続。本 session で参照・解放しない。"
  - "受入は4-gate 後 GPT 司令塔の検収判定をもって完了。"
  - "spec 文書（docs/specs/project_command_center_v0_spec.md）は本 session-172d-pre と同一 commit に含める。別コミットで分割しない。"
  - "completion_criteria.type の enum と review_points の固定4軸は global_rules.md 正本に文字一致で従うこと。文字違い（半角全角・記号差）は document_rule 違反として扱う。"
