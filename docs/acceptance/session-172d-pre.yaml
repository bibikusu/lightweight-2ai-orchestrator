session_id: session-172d-pre
goal: session-172 衝突解決後、read-only dashboard 実装仕様を session-172d として正本化する

scope:
  - session-172d の session JSON を起票する
  - session-172d の acceptance YAML を起票する
  - session-172-pre の dashboard 契約を session-172d に handoff する
  - session-172d の allowed_changes / forbidden_changes を定義する
  - session-172d の completion_criteria / acceptance_criteria を定義する

out_of_scope:
  - dashboard 実装
  - backend API 実装
  - session-172 の編集
  - session-172-pre の編集
  - orchestration の変更
  - tests の変更
  - scripts の変更
  - framework / build system 導入
  - session-173 以降の未来機能

acceptance:
  - id: AC-172DPRE-01
    requirement: session-172d-pre.json が作成されている
    test_name: test_session_172d_pre_json_exists
    type: automated
    manual_check: false
    verification:
      - docs/sessions/session-172d-pre.json が存在する

  - id: AC-172DPRE-02
    requirement: session-172d-pre.yaml が作成されている
    test_name: test_session_172d_pre_yaml_exists
    type: automated
    manual_check: false
    verification:
      - docs/acceptance/session-172d-pre.yaml が存在する

  - id: AC-172DPRE-03
    requirement: review_points 4軸が正本どおりである
    test_name: test_session_172d_pre_review_points_canonical
    type: automated
    manual_check: false
    verification:
      - review_points[0] == "仕様一致（AC達成）"
      - review_points[1] == "変更範囲遵守"
      - review_points[2] == "副作用なし（既存破壊なし）"
      - review_points[3] == "検証十分性（テスト・証跡・再現性により、受入判断に足る根拠があること）"

  - id: AC-172DPRE-04
    requirement: allowed_changes が 2件に限定されている
    test_name: test_session_172d_pre_allowed_changes_count
    type: automated
    manual_check: false
    verification:
      - len(allowed_changes) == 2
      - docs/sessions/session-172d-pre.json が含まれる
      - docs/acceptance/session-172d-pre.yaml が含まれる

  - id: AC-172DPRE-05
    requirement: forbidden_changes に session-172 / session-172-pre の 4ファイルが含まれている
    test_name: test_session_172d_pre_forbidden_includes_legacy_sessions
    type: automated
    manual_check: false
    verification:
      - forbidden_changes に "docs/sessions/session-172.json" が含まれる
      - forbidden_changes に "docs/acceptance/session-172.yaml" が含まれる
      - forbidden_changes に "docs/sessions/session-172-pre.json" が含まれる
      - forbidden_changes に "docs/acceptance/session-172-pre.yaml" が含まれる

  - id: AC-172DPRE-06
    requirement: session-172 / session-172-pre が変更されていない
    test_name: test_session_172_and_172pre_unchanged
    type: automated
    manual_check: false
    verification:
      - git diff --name-only に docs/sessions/session-172.json が含まれない
      - git diff --name-only に docs/acceptance/session-172.yaml が含まれない
      - git diff --name-only に docs/sessions/session-172-pre.json が含まれない
      - git diff --name-only に docs/acceptance/session-172-pre.yaml が含まれない

  - id: AC-172DPRE-07
    requirement: 変更範囲が allowed 2件に限定されている
    test_name: test_session_172d_pre_scope_limited
    type: automated
    manual_check: false
    verification:
      - git status --short が docs/sessions/session-172d-pre.json / docs/acceptance/session-172d-pre.yaml のみを返す
      - forbidden_changes に列挙されたパスに変更がない

completion_checks:
  - CC-172DPRE-01: session-172d の session JSON が定義されている
  - CC-172DPRE-02: session-172d の acceptance YAML が定義されている
  - CC-172DPRE-03: session-172-pre の dashboard 契約が session-172d に handoff されている
  - CC-172DPRE-04: session-172 / session-172-pre が変更されていない
  - CC-172DPRE-05: orchestration / scripts / tests / .github / .claude / backend に変更がない

change_guardrails:
  allowed_changes:
    - docs/sessions/session-172d-pre.json
    - docs/acceptance/session-172d-pre.yaml
  forbidden_changes:
    - orchestration/**
    - scripts/**
    - tests/**
    - .github/**
    - .claude/**
    - dashboard/**
    - backend/**
    - docs/config/**
    - docs/master_instruction.md
    - docs/global_rules.md
    - docs/sessions/session-172.json
    - docs/acceptance/session-172.yaml
    - docs/sessions/session-172-pre.json
    - docs/acceptance/session-172-pre.yaml
    - 既存 session 定義の変更
    - 既存 acceptance 定義の変更
    - push 実行
