session_id: session-176-pre
goal: セッション起票前後の事故防止 canonical を global_rules.md に正本化する

scope:
  - docs/global_rules.md に Step0 標準（項目A）を追記する
  - docs/global_rules.md に session_id 採番ルール（項目B）を追記する
  - docs/global_rules.md に session_id 衝突防止ルール（項目C）を追記する
  - docs/global_rules.md に stash governance（項目D）を追記する
  - docs/global_rules.md に ClaudeCode 禁止 git 操作（項目E）を追記する
  - docs/sessions/session-176-pre.json を起票する
  - docs/acceptance/session-176-pre.yaml を起票する

out_of_scope:
  - dashboard 実装
  - backend API 実装
  - orchestration の変更
  - tests の変更
  - scripts の変更
  - docs/master_instruction.md の変更
  - session-172 / session-172-pre / session-172d-pre / session-173-pre の変更
  - framework / build system 導入

acceptance:
  - id: AC-176PRE-01
    requirement: docs/global_rules.md に Step0 標準が追記されている
    test_name: test_global_rules_step0_standard_appended
    type: automated
    manual_check: false
    verification:
      - global_rules.md に "Step0 標準" の見出しが含まれる
      - git status / git rev-parse HEAD / git rev-parse origin/main / git stash list の4コマンドが記載されている

  - id: AC-176PRE-02
    requirement: docs/global_rules.md に session_id 採番ルールが追記されている
    test_name: test_global_rules_session_id_numbering_rule_appended
    type: automated
    manual_check: false
    verification:
      - global_rules.md に "採番ルール" の見出しが含まれる
      - docs/sessions/ と docs/acceptance/ の両方を grep する旨が記載されている

  - id: AC-176PRE-03
    requirement: docs/global_rules.md に session_id 衝突防止ルールが追記されている
    test_name: test_global_rules_session_id_collision_rule_appended
    type: automated
    manual_check: false
    verification:
      - global_rules.md に "衝突防止" の見出しが含まれる
      - session-172-pre / session-172 の legacy 例外が明記されている

  - id: AC-176PRE-04
    requirement: docs/global_rules.md に stash governance が追記されている
    test_name: test_global_rules_stash_governance_appended
    type: automated
    manual_check: false
    verification:
      - global_rules.md に "stash governance" の見出しが含まれる
      - ClaudeCode / Cursor / オーケストレーターの stash 禁止が明記されている

  - id: AC-176PRE-05
    requirement: docs/global_rules.md に ClaudeCode 禁止 git 操作が追記されている
    test_name: test_global_rules_claudecode_forbidden_git_ops_appended
    type: automated
    manual_check: false
    verification:
      - global_rules.md に "ClaudeCode 禁止 git 操作" の見出しが含まれる
      - git push / git commit --amend / git rebase / git stash が禁止リストに含まれる

  - id: AC-176PRE-06
    requirement: session-176-pre.json が作成されている
    test_name: test_session_176_pre_json_exists
    type: automated
    manual_check: false
    verification:
      - docs/sessions/session-176-pre.json が存在する

  - id: AC-176PRE-07
    requirement: session-176-pre.yaml が作成されている
    test_name: test_session_176_pre_yaml_exists
    type: automated
    manual_check: false
    verification:
      - docs/acceptance/session-176-pre.yaml が存在する

  - id: AC-176PRE-08
    requirement: review_points 4軸が canonical と一致している
    test_name: test_session_176_pre_review_points_canonical
    type: automated
    manual_check: false
    verification:
      - review_points[0] == "仕様一致（AC達成）"
      - review_points[1] == "変更範囲遵守"
      - review_points[2] == "副作用なし（既存破壊なし）"
      - review_points[3] == "検証十分性（テスト・証跡・再現性により、受入判断に足る根拠があること）"

  - id: AC-176PRE-09
    requirement: allowed_changes が 3件に限定されている
    test_name: test_session_176_pre_allowed_changes_count
    type: automated
    manual_check: false
    verification:
      - len(allowed_changes) == 3
      - docs/sessions/session-176-pre.json が含まれる
      - docs/acceptance/session-176-pre.yaml が含まれる
      - docs/global_rules.md が含まれる

  - id: AC-176PRE-10
    requirement: forbidden_changes に session-172* / session-173-pre の保護ファイルが含まれている
    test_name: test_session_176_pre_forbidden_includes_protected_sessions
    type: automated
    manual_check: false
    verification:
      - forbidden_changes に "docs/sessions/session-172.json" が含まれる
      - forbidden_changes に "docs/sessions/session-172-pre.json" が含まれる
      - forbidden_changes に "docs/sessions/session-172d-pre.json" が含まれる
      - forbidden_changes に "docs/sessions/session-173-pre.json" が含まれる

  - id: AC-176PRE-11
    requirement: 変更範囲が allowed 3件に限定されている
    test_name: test_session_176_pre_scope_limited
    type: automated
    manual_check: false
    verification:
      - git diff --name-only が docs/sessions/session-176-pre.json / docs/acceptance/session-176-pre.yaml / docs/global_rules.md のみを返す
      - forbidden_changes に列挙されたパスに変更がない

  - id: AC-176PRE-12
    requirement: global_rules.md の追記が 70行以内である
    test_name: test_global_rules_append_within_70_lines
    type: automated
    manual_check: false
    verification:
      - git diff docs/global_rules.md の追加行数が 70 以内である

completion_checks:
  - CC-176PRE-01: docs/global_rules.md に Step0 標準（項目A）が追記されている
  - CC-176PRE-02: docs/global_rules.md に session_id 採番ルール（項目B）が追記されている
  - CC-176PRE-03: docs/global_rules.md に session_id 衝突防止ルール（項目C）が追記されている
  - CC-176PRE-04: docs/global_rules.md に stash governance（項目D）が追記されている
  - CC-176PRE-05: docs/global_rules.md に ClaudeCode 禁止 git 操作（項目E）が追記されている
  - CC-176PRE-06: docs/sessions/session-176-pre.json が作成されている
  - CC-176PRE-07: docs/acceptance/session-176-pre.yaml が作成されている
  - CC-176PRE-08: orchestration / scripts / tests / backend / .github / .claude / 既存 session 定義に変更がない

change_guardrails:
  allowed_changes:
    - docs/sessions/session-176-pre.json
    - docs/acceptance/session-176-pre.yaml
    - docs/global_rules.md
  forbidden_changes:
    - orchestration/**
    - scripts/**
    - tests/**
    - backend/**
    - .github/**
    - .claude/**
    - DL/**
    - docs/config/**
    - docs/master_instruction.md
    - docs/sessions/session-172.json
    - docs/sessions/session-172-pre.json
    - docs/sessions/session-172a.json
    - docs/sessions/session-172d-pre.json
    - docs/sessions/session-173-pre.json
    - docs/acceptance/session-172.yaml
    - docs/acceptance/session-172-pre.yaml
    - docs/acceptance/session-172a.yaml
    - docs/acceptance/session-172d-pre.yaml
    - docs/acceptance/session-173-pre.yaml
    - git push 実行
    - git stash 系操作
    - git amend 実行
    - git rebase 実行
    - git cherry-pick 実行
    - git reset --hard 実行
    - git branch -D / -d 実行
