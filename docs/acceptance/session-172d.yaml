session_id: session-172d
phase_id: P7
title: "Project Command Center v0 実装 session 起票（docs-only）"
session_type: docs_only_specification
related_spec: docs/specs/project_command_center_v0_spec.md

acceptance_criteria:
  - id: AC-01
    description: "session-172d.json が14必須キーを全て含む"
    test_name: test_session_172d_json_required_keys
    type: auto
    method: required_keys_check
    target: docs/sessions/session-172d.json
    required_keys:
      - session_id
      - phase_id
      - title
      - goal
      - scope
      - out_of_scope
      - constraints
      - acceptance_ref
      - allowed_changes
      - allowed_changes_detail
      - forbidden_changes
      - completion_criteria
      - acceptance_criteria
      - review_points
    completion_criteria_refs: [CC-172D-03]

  - id: AC-02
    description: "acceptance_ref が docs/acceptance/session-172d.yaml を指し、ファイルが存在し safe_load 可能"
    test_name: test_session_172d_acceptance_ref_matches
    type: auto
    method: file_exists_and_value_check
    target: docs/sessions/session-172d.json
    json_path: $.acceptance_ref
    expected_value: "docs/acceptance/session-172d.yaml"
    completion_criteria_refs: [CC-172D-01, CC-172D-02]

  - id: AC-03
    description: "allowed_changes_detail が『path: 内容』形式の list[str]"
    test_name: test_session_172d_allowed_changes_detail_format
    type: auto
    method: regex_each_element_match
    target: docs/sessions/session-172d.json
    json_path: $.allowed_changes_detail
    pattern: '^[^:\s]+:\s+.+$'
    completion_criteria_refs: [CC-172D-08]

  - id: AC-04
    description: "forbidden_changes に orchestration/** / backend/** / scripts/** が含まれる"
    test_name: test_session_172d_forbids_execution_controls
    type: auto
    method: array_contains_all
    target: docs/sessions/session-172d.json
    json_path: $.forbidden_changes
    required_values:
      - "orchestration/**"
      - "backend/**"
      - "scripts/**"
    completion_criteria_refs: [CC-172D-09]

  - id: AC-05
    description: "constraints に read-only / 実行制御禁止 / DB禁止 / daemon禁止 / background watcher禁止 が明記されている"
    test_name: test_session_172d_defines_read_only_constraints
    type: auto
    method: substring_all_present
    target: docs/sessions/session-172d.json
    json_path: $.constraints
    required_substrings:
      - "read-only"
      - "実行制御"
      - "DB"
      - "daemon"
      - "background watcher"
    completion_criteria_refs: [CC-172D-06]

  - id: AC-06
    description: "followup_session_candidates に後続実装 session の候補 10ファイルが全件列挙されている"
    test_name: test_session_172d_defines_10_followup_files
    type: auto
    method: array_contains_all
    target: docs/sessions/session-172d.json
    json_path: $.followup_session_candidates
    required_values:
      - "backend/pcc/__init__.py"
      - "backend/pcc/pcc_v0.py"
      - "backend/pcc/static/index.html"
      - "backend/pcc/static/style.css"
      - "backend/pcc/static/app.js"
      - "backend/pcc/server.py"
      - "scripts/pcc"
      - "docs/sessions/session-172d.json"
      - "docs/acceptance/session-172d.yaml"
      - "tests/test_pcc_v0.py"
    completion_criteria_refs: [CC-172D-05]

  - id: AC-07
    description: "review_points が固定4軸を順序通り文字一致で含む"
    test_name: test_session_172d_review_points_exact
    type: auto
    method: list_equals_in_order
    target: docs/sessions/session-172d.json
    json_path: $.review_points
    expected:
      - "仕様一致（AC達成）"
      - "変更範囲遵守"
      - "副作用なし"
      - "検証十分性"
    completion_criteria_refs: [CC-172D-07]

  - id: AC-08
    description: "session-172d.yaml の session_id / AC 番号が session-172d.json と整合する"
    test_name: test_session_172d_acceptance_yaml_matches_json
    type: auto
    method: cross_file_consistency_check
    targets:
      - docs/sessions/session-172d.json
      - docs/acceptance/session-172d.yaml
    checks:
      - field: session_id
        expected: "session-172d"
      - field: ac_ids
        expected: ["AC-01", "AC-02", "AC-03", "AC-04", "AC-05", "AC-06", "AC-07", "AC-08", "AC-09"]
    completion_criteria_refs: [CC-172D-04]

  - id: AC-09
    description: "allowed_changes が docs 2ファイルのみ（scope が2ファイルに限定されている）"
    test_name: test_session_172d_scope_only_two_files
    type: auto
    method: array_length_check
    target: docs/sessions/session-172d.json
    json_path: $.allowed_changes
    expected_length: 2
    completion_criteria_refs: [CC-172D-09]

manual_acceptance_criteria: []

review_points:
  - "仕様一致（AC達成）"
  - "変更範囲遵守"
  - "副作用なし"
  - "検証十分性"

forbidden_diff_paths:
  - orchestration/**
  - backend/**
  - scripts/**
  - tests/**
  - docs/config/**
  - docs/projects/**
  - docs/specs/project_command_center_v0_spec.md
  - docs/master_instruction.md
  - docs/global_rules.md
  - DL/**
  - .playwright-mcp/**

notes:
  - "docs-only セッション。実装コードは1行も変更しない。"
  - "PCC v0 は read-only aggregation layer。実行制御（run_session.py / queue engine）および DB / daemon / background watcher は禁止。"
  - "queue_state.json 不在時は「—（未設定）」表示。git 未管理 project は「—（git未管理）」表示。"
  - "A02_fina の branch=sandbox/session-11、dirty=14件の現状は隠さず表示する。"
  - "後続実装 session の allowed_changes 候補 10ファイルは followup_session_candidates に明記済み。"
  - "受入は4-gate 後 GPT 司令塔の検収判定をもって完了。"
