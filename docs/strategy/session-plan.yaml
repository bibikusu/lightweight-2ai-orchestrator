# ============================================================
# Autonomy Level 凡例
# ============================================================
autonomy_levels:
  L0_hard_block:
    description: "永久禁止"
    examples:
      - "本番 DB 直接 SQL"
      - "rm -rf"
      - "sudo"
      - "git push --force"
      - "PII export"
      - "Anthropic/OpenAI 経由 NSFW (規約NG)"
      
  L1_required_approval:
    description: "人間承認必須 (不可逆な action)"
    examples:
      - "main branch merge"
      - "git push"
      - "本番 deploy"
      - "DB migration"
      - "OAuth 設定"
      - "新規依存追加 (npm install / pip install)"
      - "規約 NG 領域への参入判断"
      
  L2_supervised:
    description: "通知のみ、AI が実行可能"
    examples:
      - "sandbox 内大規模 refactor"
      - "新規 collection / table 作成"
      - "外部 API GET 通信"
      
  L3_auto:
    description: "完全自動、人間関与なし"
    examples:
      - "sandbox 内 file read/write"
      - "4-gate 検証 (ruff/pytest/mypy/compileall)"
      - "git commit (sandbox branch)"
      - "artifact 生成"
      - "lint/format 自動修正"
      - "ローカル LLM 呼出"
      
  docs-only:
    description: "ドキュメントのみ変更、コード変更なし"
    examples:
      - "session JSON / acceptance YAML 起票"
      - "CLAUDE.md 整備"
      - "戦略文書作成"

# ============================================================
# Status 凡例
# ============================================================
status_definitions:
  ✅completed:
    description: "完了、commit 確定"
    requires: ["commit hash", "date"]
    
  in_progress:
    description: "進行中"
    requires: ["date", "expected_completion"]
    
  pending:
    description: "未着手、依存解消待ちまたは順序待ち"
    requires: []
    
  backlog:
    description: "将来やる、優先度低、後日項目"
    requires: []
    
  blocked:
    description: "依存解消待ち、外部要因で止まっている"
    requires: ["blocker_description"]
    
  frozen:
    description: "凍結、再開時期未定"
    requires: ["freeze_date", "freeze_reason"]
    
  killed:
    description: "中止、再開しない"
    requires: ["kill_date", "kill_reason"]

# ============================================================
# Session ID 命名規則 (再掲)
# ============================================================
naming_convention:
  pattern: "<PREFIX>-<SUBPHASE>-<SHORT-DESC>"
  prefixes:
    - "V2-Z{0..9}: 体制 v2 への移行セッション"
    - "A{01..12}-session-{NN}: 各プロジェクト個別 session (例: A02-session-04)"
    - "A{01..12}-{phase}-{desc}: Phase 別 (例: A01-P0-VALIDATE, A05-04-VERIFY)"
    - "NSFW-D{1..6}: NSFW 共通基盤セッション"
    - "F-{NN}-{desc}: Phase F 安定運用セッション"
    - "A-{0..14}: Phase A 基盤構築セッション"
    - "A02-B{1..6}: Phase B 準備セッション (A02 専用)"
  collision_check:
    rule: "起票前に git log --grep '<session_id>' で衝突確認必須"
    
# ============================================================
# 月次見直しルール (次回 2026-06-16)
# ============================================================
review_rules:
  monthly:
    when: "毎月 16 日 (前月分の総括 + 翌月分の調整)"
    actions:
      - "完了済 session の commit hash 記録"
      - "delayed session の理由分析、新 hard_gate_date 設定"
      - "frozen / killed の追加"
      - "新規 session 追加 (実装中に発見されたもの)"
      - "Early Warning Sign 結果反映 (lessons-learned.md §4)"
      
  quarterly:
    when: "3 ヶ月ごと"
    actions:
      - "Stage 構造の見直し"
      - "AI 自走比率の実績 vs 計画比較"
      - "投入時間実績の集計"
      - "次四半期の Phase 内容調整"
      
  semi_annual:
    when: "6 ヶ月ごと"
    actions:
      - "Phase 構造の大幅修正可"
      - "12 プロジェクト優先順位の再判定"
      - "AI モデル切替判定"
      - "並列数調整"

